requirements:
  - requirement_id: "R-CRC"
    kind: "3gpp"
    standard_version: "ETSI TS 138 212 V17.13.0 (3GPP Release 17)"
    clause: "5.1; 6.2.1; 7.2.1"
    description: "Attach TB CRC16 at A ≤ 3824 and CRC24A above it; verify raw CRC bits and syndrome on recovery."
    preconditions: "Byte-aligned TB of A payload bits."
    parameter_domains: "CRC16 0x1021; CRC24A 0x864CFB (leading term omitted)."
    test_case_ids: ["GOLD-QPSK", "GOLD-BG1", "BG-A288", "BG-A304", "BG-A3824", "BG-A3840", "BG-RLOW", "BG-RHIGH", "BG-R25", "BG-R067", "BG-R067-ABOVE", "SEG-BG2-ONE", "SEG-BG2-TWO", "SEG-BG1-ONE", "SEG-BG1-TWO", "RV-BG1-0", "RV-BG1-1", "RV-BG1-2", "RV-BG1-3", "RV-BG2-0", "RV-BG2-1", "RV-BG2-2", "RV-BG2-3", "AWGN-SMOKE", "AWGN-LOW", "AWGN-MID", "AWGN-HIGH", "FAULT-RM-FLIP", "FAULT-CRC-FLIP", "SEG-BG2-FOUR", "RV-BG2-REPEAT"]
    oracle_type: "Independent polynomial division and GPU CRC result"
    coverage: "implemented"
  - requirement_id: "R-BG"
    kind: "3gpp"
    standard_version: "ETSI TS 138 212 V17.13.0 (3GPP Release 17)"
    clause: "6.2.2; 7.2.2"
    description: "BG2 if A ≤ 292, or A ≤ 3824 and R ≤ 0.67, or R ≤ 0.25. Otherwise BG1."
    preconditions: "Use the initial transmission coding rate for retransmissions."
    parameter_domains: "A in bits; R normalized; BG in {1,2}."
    test_case_ids: ["GOLD-QPSK", "GOLD-BG1", "BG-A288", "BG-A304", "BG-A3824", "BG-A3840", "BG-RLOW", "BG-RHIGH", "BG-R25", "BG-R067", "BG-R067-ABOVE", "SEG-BG2-ONE", "SEG-BG2-TWO", "SEG-BG1-ONE", "SEG-BG1-TWO", "SEG-BG2-FOUR"]
    oracle_type: "Independent geometry plus source-backed native encoder output length; SDK helper checked separately"
    coverage: "implemented"
  - requirement_id: "R-SEG"
    kind: "3gpp"
    standard_version: "ETSI TS 138 212 V17.13.0 (3GPP Release 17)"
    clause: "5.2.2; 6.2.3; 7.2.3"
    description: "Use B=A+L_TB to select CB count; add CRC24B on each multi-CB segment; choose minimum admissible Zc; filler is NULL from K-prime to K-1."
    preconditions: "Byte-aligned TB and integral B-prime/C in this SDK profile."
    parameter_domains: "Kcb=8448 (BG1), 3840 (BG2); L_CB=0 or 24."
    test_case_ids: ["GOLD-QPSK", "GOLD-BG1", "SEG-BG2-ONE", "SEG-BG2-TWO", "SEG-BG1-ONE", "SEG-BG1-TWO", "SEG-BG2-FOUR"]
    oracle_type: "Independent CB geometry and bit reference; filler suppression in RM"
    coverage: "implemented"
  - requirement_id: "R-LDPC"
    kind: "3gpp"
    standard_version: "ETSI TS 138 212 V17.13.0 (3GPP Release 17)"
    clause: "5.3.2; 6.2.4; 7.2.4"
    description: "Check the systematic portion with first 2Zc punctured and N=66Zc (BG1) or 50Zc (BG2)."
    preconditions: "Valid segmented input; filler representation out of scope for raw output."
    parameter_domains: "BG1/BG2, selected Zc."
    test_case_ids: ["GOLD-QPSK", "GOLD-BG1", "BG-A288", "BG-A304", "BG-A3824", "BG-A3840", "BG-RLOW", "BG-RHIGH", "BG-R25", "BG-R067", "BG-R067-ABOVE", "SEG-BG2-ONE", "SEG-BG2-TWO", "SEG-BG1-ONE", "SEG-BG1-TWO", "SEG-BG2-FOUR"]
    oracle_type: "Systematic bits/length and native round trip; parity conformance pending"
    coverage: "implemented"
  - requirement_id: "R-RM"
    kind: "3gpp"
    standard_version: "ETSI TS 138 212 V17.13.0 (3GPP Release 17)"
    clause: "5.4.2.1–5.4.2.2"
    description: "Split G into E_r, select circular bits while skipping NULL, then interleave by Qm."
    preconditions: "All CBs scheduled, one layer, unscrambled full buffer Ncb=N."
    parameter_domains: "Qm=2,4,6 in Stage 1; G multiple of Qm; includes wrap/repetition and unequal E_r."
    test_case_ids: ["GOLD-QPSK", "GOLD-BG1", "SEG-BG2-ONE", "SEG-BG2-TWO", "SEG-BG1-ONE", "SEG-BG1-TWO", "RV-BG1-0", "RV-BG1-1", "RV-BG1-2", "RV-BG1-3", "RV-BG2-0", "RV-BG2-1", "RV-BG2-2", "RV-BG2-3", "FAULT-RM-FLIP", "FAULT-CRC-FLIP", "SEG-BG2-FOUR", "RV-BG2-REPEAT"]
    oracle_type: "Independent bit index mapping on actual encoded bits"
    coverage: "implemented"
  - requirement_id: "R-RV"
    kind: "3gpp"
    standard_version: "ETSI TS 138 212 V17.13.0 (3GPP Release 17)"
    clause: "5.4.2.1 Table 5.4.2.1-2"
    description: "Use k0 as specified for RV and each BG; for Ncb=N use the listed factors times Zc."
    preconditions: "Full circular buffer and original TB geometry; no HARQ combining."
    parameter_domains: "RV=0..3; factor BG1=(0,17,33,56), BG2=(0,13,25,43)."
    test_case_ids: ["RV-BG1-0", "RV-BG1-1", "RV-BG1-2", "RV-BG1-3", "RV-BG2-0", "RV-BG2-1", "RV-BG2-2", "RV-BG2-3", "RV-BG2-REPEAT"]
    oracle_type: "Independent k0 and bit-by-bit RM"
    coverage: "implemented"
  - requirement_id: "R-CONCAT"
    kind: "3gpp"
    standard_version: "ETSI TS 138 212 V17.13.0 (3GPP Release 17)"
    clause: "5.5; 6.2.6; 7.2.6"
    description: "Concatenate the rate matched blocks in CB order to give G bits."
    preconditions: "All C blocks present; scrambling disabled."
    parameter_domains: "G=sum(E_r); ascending CB index."
    test_case_ids: ["SEG-BG2-ONE", "SEG-BG2-TWO", "SEG-BG1-ONE", "SEG-BG1-TWO", "RV-BG1-0", "RV-BG1-1", "RV-BG1-2", "RV-BG1-3", "RV-BG2-0", "RV-BG2-1", "RV-BG2-2", "RV-BG2-3", "SEG-BG2-FOUR", "RV-BG2-REPEAT"]
    oracle_type: "Independent per-CB output lengths and concatenated bits"
    coverage: "implemented"
  - requirement_id: "R-MCS-TBS"
    kind: "3gpp"
    standard_version: "ETSI TS 138 214 V17.13.0 (3GPP Release 17)"
    clause: "5.1.3.1 Table 5.1.3.1-1; 5.1.3.2/Table 5.1.3.2-1"
    description: "Map MCS to Qm and target R; validate TBS on the effective RE allocation model."
    preconditions: "Initial allocation, one layer, ordinary table 1, equal effective RE per PRB; retransmission RV uses the same geometry."
    parameter_domains: "MCS 0..28; reserved indices rejected."
    test_case_ids: ["GOLD-QPSK", "GOLD-BG1", "BG-A288", "BG-A304", "BG-A3824", "BG-A3840", "BG-RLOW", "BG-RHIGH", "SEG-BG2-ONE", "SEG-BG2-TWO", "SEG-BG1-ONE", "SEG-BG1-TWO", "RV-BG1-0", "RV-BG1-1", "RV-BG1-2", "RV-BG1-3", "RV-BG2-0", "RV-BG2-1", "RV-BG2-2", "RV-BG2-3", "AWGN-SMOKE", "AWGN-LOW", "AWGN-MID", "AWGN-HIGH", "FAULT-RM-FLIP", "FAULT-CRC-FLIP", "SEG-BG2-FOUR", "RV-BG2-REPEAT"]
    oracle_type: "Independent table and TBS calculation"
    coverage: "implemented"
  - requirement_id: "R-MOD"
    kind: "3gpp"
    standard_version: "ETSI TS 138 211 V17.10.0 (3GPP Release 17)"
    clause: "5.1.3–5.1.5"
    description: "Group Qm bits per symbol and verify unit-normalized constellation labeling for the profile."
    preconditions: "Unscrambled bits after concatenation."
    parameter_domains: "Qm 2,4,6; exact mapping checked numerically."
    test_case_ids: ["GOLD-QPSK", "GOLD-BG1", "RV-BG1-0", "RV-BG1-1", "RV-BG1-2", "RV-BG1-3", "RV-BG2-0", "RV-BG2-1", "RV-BG2-2", "RV-BG2-3", "AWGN-SMOKE", "AWGN-LOW", "AWGN-MID", "AWGN-HIGH", "RV-BG2-REPEAT", "BG-A288", "BG-A304"]
    oracle_type: "Independent complex symbols"
    coverage: "implemented"
  - requirement_id: "SDK-CHAIN"
    kind: "sdk"
    standard_version: "Aerial 26-2 at 4f65f97c"
    clause: "pyaerial/README.md; ldpc/*; util/cuda.py"
    description: "One TB per call with seeded packed bytes; native results synchronized before capture."
    preconditions: "Pinned SDK artifacts and real H20 GPU present. NDI=1, RV explicit."
    parameter_domains: "1 layer; <=16384 TB bits; <=4 CB; <=128 TB per case."
    test_case_ids: ["GOLD-QPSK", "GOLD-BG1", "BG-A288", "BG-A304", "BG-A3824", "BG-A3840", "BG-RLOW", "BG-RHIGH", "BG-R25", "BG-R067", "BG-R067-ABOVE", "SEG-BG2-ONE", "SEG-BG2-TWO", "SEG-BG1-ONE", "SEG-BG1-TWO", "RV-BG1-0", "RV-BG1-1", "RV-BG1-2", "RV-BG1-3", "RV-BG2-0", "RV-BG2-1", "RV-BG2-2", "RV-BG2-3", "AWGN-SMOKE", "AWGN-LOW", "AWGN-MID", "AWGN-HIGH", "FAULT-RM-FLIP", "FAULT-CRC-FLIP", "SEG-BG2-FOUR", "RV-BG2-REPEAT"]
    oracle_type: "SDK artifact provenance, shapes and round trip"
    coverage: "implemented"
  - requirement_id: "QA-AWGN"
    kind: "qa"
    standard_version: "Stage 1"
    clause: "Stage 1 test model"
    description: "Measure uncoded payload bit error rate after LDPC and transport block error rate under complex AWGN."
    preconditions: "Independent TB/noise draws; normalized mean constellation Es=1."
    parameter_domains: "Es/N0 in dB; iid Gaussian I/Q noise; fixed seeded sample budget."
    test_case_ids: ["AWGN-SMOKE", "AWGN-LOW", "AWGN-MID", "AWGN-HIGH"]
    oracle_type: "BLER Wilson and TB-cluster BER intervals"
    coverage: "implemented"
  - requirement_id: "QA-FAULT"
    kind: "qa"
    standard_version: "Stage 1"
    clause: "Stage 1 test design"
    description: "Detect changed RM bit and changed pre-CRC decoder bit through actual observations."
    preconditions: "Controlled single-bit hooks, valid clean control chain."
    parameter_domains: "Two injection stages; bit offset 7."
    test_case_ids: ["FAULT-RM-FLIP", "FAULT-CRC-FLIP"]
    oracle_type: "Independent RM comparison or payload difference with CRC syndrome"
    coverage: "implemented"
  - requirement_id: "P-PARITY"
    kind: "3gpp"
    standard_version: "ETSI TS 138 212 V17.13.0 (3GPP Release 17)"
    clause: "5.3.2 Tables 5.3.2-2/-3"
    description: "External LDPC golden codeword and exhaustive parity checks remain unverified."
    preconditions: "An independently published vector or independently reviewed parity reference."
    parameter_domains: "All supported lifting sizes and BG matrices."
    test_case_ids: []
    oracle_type: "External parity/codeword oracle"
    coverage: "pending"
  - requirement_id: "P-LBRM"
    kind: "3gpp"
    standard_version: "ETSI TS 138 212 V17.13.0 (3GPP Release 17)"
    clause: "5.4.2.1; 7.2.5"
    description: "DL-SCH LBRM conditions require validation; present exposed primitive uses Ncb=N."
    preconditions: "A configuration exposing Nref and limited buffer."
    parameter_domains: "Ncb<N; CBGTI; HARQ combining; complete physical-channel pipeline out of scope."
    test_case_ids: []
    oracle_type: "Future vector/bit oracle"
    coverage: "pending"
